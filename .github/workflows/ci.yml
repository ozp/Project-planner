name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: plataforma

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # maintenance LTS; subir para 26 após 28/out/2026 (LTS)
          cache: pnpm
          cache-dependency-path: plataforma/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
