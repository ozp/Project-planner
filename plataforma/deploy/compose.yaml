# Ambiente dev local espelhando prod (AD-15).
# Uso: docker compose -f deploy/compose.yaml up --build
name: plataforma-experimentos

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma_dev
      POSTGRES_DB: experimentos
    ports:
      - "5543:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d experimentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://plataforma:plataforma_dev@db:5432/experimentos
    ports:
      - "3311:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
